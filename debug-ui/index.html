<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puffgres Debug UI</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 20px; }
    .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
    .tab { padding: 10px 20px; cursor: pointer; background: #e0e0e0; border: none; font-size: 14px; font-weight: 500; border-radius: 4px 4px 0 0; margin-bottom: -2px; }
    .tab:hover { background: #d0d0d0; }
    .tab.active { background: white; border: 2px solid #ddd; border-bottom: 2px solid white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-row { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; width: 300px; }
    button { padding: 10px 20px; font-size: 14px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
    button:hover { background: #0055aa; }
    button:disabled { background: #999; cursor: not-allowed; }
    button.danger { background: #cc3333; }
    button.danger:hover { background: #aa2222; }
    button.small { padding: 5px 10px; font-size: 12px; }
    .results { margin-top: 20px; background: white; border: 1px solid #ddd; border-radius: 4px; padding: 15px; }
    .error { color: #cc0000; background: #ffeeee; padding: 10px; border-radius: 4px; margin-top: 10px; }
    .status { color: #666; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; font-weight: 600; }
    td { word-break: break-word; max-width: 400px; }
    pre { background: #f9f9f9; padding: 10px; overflow-x: auto; font-size: 12px; border-radius: 4px; }
    .count { color: #666; margin-bottom: 10px; }
    .namespace-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .namespace-row:hover { background: #f9f9f9; }
    .namespace-name { font-family: monospace; font-size: 14px; cursor: pointer; color: #0066cc; }
    .namespace-name:hover { text-decoration: underline; }
    .namespace-info { display: flex; gap: 15px; align-items: center; color: #666; font-size: 12px; }
    .load-more { margin-top: 15px; text-align: center; }
    .confirm-delete { background: #fff3cd; padding: 15px; border-radius: 4px; margin-top: 10px; border: 1px solid #ffc107; }
    .confirm-delete strong { color: #856404; }
  </style>
</head>
<body>
  <h1>Puffgres Debug UI</h1>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('documents')">Documents</button>
    <button class="tab" onclick="switchTab('namespaces')">Namespaces</button>
  </div>

  <!-- Documents Tab -->
  <div id="documents-tab" class="tab-content active">
    <div class="form-row">
      <label for="namespace">Namespace</label>
      <input type="text" id="namespace" placeholder="e.g. my-namespace" value="">
    </div>

    <div class="form-row">
      <label for="limit">Number of documents</label>
      <input type="number" id="limit" placeholder="10" value="10" min="1" max="10000">
    </div>

    <div>
      <button id="fetch-btn" onclick="fetchDocuments()">Fetch Documents</button>
      <button id="reload-btn" onclick="fetchDocuments()">Reload</button>
    </div>

    <div id="status" class="status"></div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="results" class="results" style="display: none;">
      <div id="count" class="count"></div>
      <div id="table-container"></div>
    </div>
  </div>

  <!-- Namespaces Tab -->
  <div id="namespaces-tab" class="tab-content">
    <div class="form-row">
      <label for="ns-prefix">Filter by prefix (optional)</label>
      <input type="text" id="ns-prefix" placeholder="e.g. prod-">
    </div>

    <div>
      <button id="ns-fetch-btn" onclick="fetchNamespaces()">Load Namespaces</button>
      <button id="ns-reload-btn" onclick="fetchNamespaces(true)">Refresh</button>
    </div>

    <div id="ns-status" class="status"></div>
    <div id="ns-error" class="error" style="display: none;"></div>

    <div id="ns-results" class="results" style="display: none;">
      <div id="ns-count" class="count"></div>
      <div id="ns-list"></div>
      <div id="ns-load-more" class="load-more" style="display: none;">
        <button onclick="fetchNamespaces(false, true)">Load More</button>
      </div>
    </div>

    <div id="ns-confirm" class="confirm-delete" style="display: none;">
      <p><strong>Are you sure you want to delete this namespace?</strong></p>
      <p>Namespace: <code id="ns-delete-name"></code></p>
      <p style="color: #cc0000;">This action cannot be undone. All documents in this namespace will be permanently deleted.</p>
      <button class="danger" onclick="confirmDelete()">Yes, Delete</button>
      <button onclick="cancelDelete()">Cancel</button>
    </div>
  </div>

  <script>
    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      document.querySelector(`.tab:nth-child(${tab === 'documents' ? 1 : 2})`).classList.add('active');
      document.getElementById(`${tab}-tab`).classList.add('active');

      if (tab === 'namespaces' && !namespacesLoaded) {
        fetchNamespaces();
      }
    }

    // Documents tab state
    const savedNamespace = localStorage.getItem('debug-ui-namespace');
    if (savedNamespace) document.getElementById('namespace').value = savedNamespace;

    // Namespaces tab state
    let namespacesLoaded = false;
    let namespacesCursor = null;
    let allNamespaces = [];
    let pendingDeleteNamespace = null;

    async function fetchDocuments() {
      const namespace = document.getElementById('namespace').value.trim();
      const limit = parseInt(document.getElementById('limit').value) || 10;

      if (!namespace) {
        showError('Please enter a namespace');
        return;
      }

      localStorage.setItem('debug-ui-namespace', namespace);

      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const resultsEl = document.getElementById('results');

      errorEl.style.display = 'none';
      resultsEl.style.display = 'none';
      statusEl.textContent = 'Fetching...';

      document.getElementById('fetch-btn').disabled = true;
      document.getElementById('reload-btn').disabled = true;

      try {
        const response = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ namespace, limit })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        displayResults(data);
        statusEl.textContent = `Fetched at ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        showError(err.message);
        statusEl.textContent = '';
      } finally {
        document.getElementById('fetch-btn').disabled = false;
        document.getElementById('reload-btn').disabled = false;
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function displayResults(data) {
      const resultsEl = document.getElementById('results');
      const countEl = document.getElementById('count');
      const tableEl = document.getElementById('table-container');

      const rows = data.rows || [];
      countEl.textContent = `Found ${rows.length} document(s)`;

      if (rows.length === 0) {
        tableEl.innerHTML = '<p>No documents found in this namespace.</p>';
        resultsEl.style.display = 'block';
        return;
      }

      // Collect all attribute keys
      const allKeys = new Set(['id']);
      rows.forEach(row => {
        Object.keys(row).forEach(k => {
          if (k !== '$dist') allKeys.add(k);
        });
      });
      const keys = Array.from(allKeys);

      // Build table
      let html = '<table><thead><tr>';
      keys.forEach(k => html += `<th>${escapeHtml(k)}</th>`);
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        html += '<tr>';
        keys.forEach(k => {
          const val = row[k];
          let display = '';
          if (val === undefined || val === null) {
            display = '<span style="color:#999">-</span>';
          } else if (k === 'vector' && Array.isArray(val)) {
            // Show truncated vector
            const preview = val.slice(0, 3).map(v => v.toFixed(4)).join(', ');
            display = `<span style="color:#666; font-family:monospace; font-size:11px">[${preview}, ...] (${val.length}d)</span>`;
          } else if (typeof val === 'object') {
            display = `<pre>${escapeHtml(JSON.stringify(val, null, 2))}</pre>`;
          } else {
            display = escapeHtml(String(val));
          }
          html += `<td>${display}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      tableEl.innerHTML = html;
      resultsEl.style.display = 'block';
    }

    async function fetchNamespaces(refresh = false, loadMore = false) {
      const prefix = document.getElementById('ns-prefix').value.trim();
      const statusEl = document.getElementById('ns-status');
      const errorEl = document.getElementById('ns-error');
      const resultsEl = document.getElementById('ns-results');

      if (refresh) {
        namespacesCursor = null;
        allNamespaces = [];
      }

      errorEl.style.display = 'none';
      statusEl.textContent = 'Loading namespaces...';

      document.getElementById('ns-fetch-btn').disabled = true;
      document.getElementById('ns-reload-btn').disabled = true;

      try {
        let url = '/api/namespaces';
        const params = [];
        if (namespacesCursor && loadMore) params.push(`cursor=${encodeURIComponent(namespacesCursor)}`);
        if (prefix) params.push(`prefix=${encodeURIComponent(prefix)}`);
        if (params.length) url += '?' + params.join('&');

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        namespacesLoaded = true;
        namespacesCursor = data.next_cursor || null;

        const newNamespaces = data.namespaces || [];
        if (loadMore) {
          allNamespaces = [...allNamespaces, ...newNamespaces];
        } else {
          allNamespaces = newNamespaces;
        }

        displayNamespaces();
        statusEl.textContent = `Loaded at ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        showNsError(err.message);
        statusEl.textContent = '';
      } finally {
        document.getElementById('ns-fetch-btn').disabled = false;
        document.getElementById('ns-reload-btn').disabled = false;
      }
    }

    function showNsError(msg) {
      const errorEl = document.getElementById('ns-error');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function displayNamespaces() {
      const resultsEl = document.getElementById('ns-results');
      const countEl = document.getElementById('ns-count');
      const listEl = document.getElementById('ns-list');
      const loadMoreEl = document.getElementById('ns-load-more');

      countEl.textContent = `Found ${allNamespaces.length} namespace(s)${namespacesCursor ? ' (more available)' : ''}`;

      if (allNamespaces.length === 0) {
        listEl.innerHTML = '<p>No namespaces found.</p>';
        loadMoreEl.style.display = 'none';
        resultsEl.style.display = 'block';
        return;
      }

      let html = '';
      allNamespaces.forEach(ns => {
        const name = ns.id || ns.name || ns;
        const docCount = ns.approx_count !== undefined ? ns.approx_count : null;
        html += `
          <div class="namespace-row">
            <span class="namespace-name" onclick="viewNamespace('${escapeHtml(name)}')">${escapeHtml(name)}</span>
            <div class="namespace-info">
              ${docCount !== null ? `<span>${docCount.toLocaleString()} docs</span>` : ''}
              <button class="small danger" onclick="requestDelete('${escapeHtml(name)}')">Delete</button>
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;
      loadMoreEl.style.display = namespacesCursor ? 'block' : 'none';
      resultsEl.style.display = 'block';
    }

    function viewNamespace(name) {
      document.getElementById('namespace').value = name;
      switchTab('documents');
      fetchDocuments();
    }

    function requestDelete(name) {
      pendingDeleteNamespace = name;
      document.getElementById('ns-delete-name').textContent = name;
      document.getElementById('ns-confirm').style.display = 'block';
    }

    function cancelDelete() {
      pendingDeleteNamespace = null;
      document.getElementById('ns-confirm').style.display = 'none';
    }

    async function confirmDelete() {
      if (!pendingDeleteNamespace) return;

      const name = pendingDeleteNamespace;
      const confirmEl = document.getElementById('ns-confirm');
      const statusEl = document.getElementById('ns-status');

      statusEl.textContent = `Deleting ${name}...`;

      try {
        const response = await fetch(`/api/namespaces/${encodeURIComponent(name)}`, {
          method: 'DELETE'
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        // Remove from local list
        allNamespaces = allNamespaces.filter(ns => {
          const nsName = ns.id || ns.name || ns;
          return nsName !== name;
        });

        displayNamespaces();
        statusEl.textContent = `Deleted ${name} at ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        showNsError(`Failed to delete: ${err.message}`);
        statusEl.textContent = '';
      } finally {
        cancelDelete();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
